<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>武汉 · 第一个 Leaflet 地图</title>
<link rel="stylesheet" href="./leaflet.css">
<style>
  html, body { margin: 0; height: 100%; font-family: "Microsoft YaHei", system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  .tip {
    position: absolute; z-index: 1000; left: 12px; top: 12px;
    background: #fff; padding: 10px 14px; border-radius: 8px;
    box-shadow: 0 2px 10px rgba(0,0,0,.18); font-size: 13px; line-height: 1.7; color: #333;
  }
  .tip b { color: #1B9AAA; }
  #locBtn {
    position: absolute; z-index: 1000; right: 12px; top: 12px;
    background: #1B9AAA; color: #fff; border: 0; border-radius: 8px;
    padding: 10px 16px; font-size: 14px; cursor: pointer; font-family: inherit;
    box-shadow: 0 2px 10px rgba(0,0,0,.2);
  }
  #locBtn:disabled { background: #9CB3B8; cursor: default; }
  #bldBtn {
    position: absolute; z-index: 1000; left: 12px; bottom: 12px;
    background: rgba(255,255,255,.95); color: #55606e; border: 1px solid #cbd5e0;
    border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer;
    font-family: inherit; box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  #locMsg {
    position: absolute; z-index: 1000; right: 12px; top: 56px;
    width: 210px; background: rgba(255,255,255,.96); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; line-height: 1.6; color: #555;
    box-shadow: 0 2px 10px rgba(0,0,0,.15); display: none;
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="tip">
  拖一拖、滚轮放大试试<br>
  彩色圆点可以点开看介绍<br>
  灰蓝色块是 OSM 建筑轮廓，鼠标移上去有楼名
</div>
<button id="locBtn">定位我</button>
<button id="bldBtn">隐藏建筑</button>
<div id="locMsg"></div>

<script src="./leaflet.js"></script>
<script>
  // —— 高德瓦片用的是 GCJ-02（火星坐标），而 GPS/网上查到的经纬度是 WGS-84 ——
  // 不转换的话点会偏 300~500 米，所以先把 WGS-84 转成 GCJ-02 再交给 Leaflet
  var PI = Math.PI, AA = 6378245.0, EE = 0.00669342162296594323;
  function outOfChina(lng, lat) {
    return !(lng > 73.66 && lng < 135.05 && lat > 3.86 && lat < 53.55);
  }
  function tLat(x, y) {
    var r = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
    r += (20 * Math.sin(6 * x * PI) + 20 * Math.sin(2 * x * PI)) * 2 / 3;
    r += (20 * Math.sin(y * PI) + 40 * Math.sin(y / 3 * PI)) * 2 / 3;
    r += (160 * Math.sin(y / 12 * PI) + 320 * Math.sin(y * PI / 30)) * 2 / 3;
    return r;
  }
  function tLng(x, y) {
    var r = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
    r += (20 * Math.sin(6 * x * PI) + 20 * Math.sin(2 * x * PI)) * 2 / 3;
    r += (20 * Math.sin(x * PI) + 40 * Math.sin(x / 3 * PI)) * 2 / 3;
    r += (150 * Math.sin(x / 12 * PI) + 300 * Math.sin(x / 30 * PI)) * 2 / 3;
    return r;
  }
  // 2026-11-12：底图从高德瓦片（GCJ-02）换成了 OSM 瓦片（WGS-84）。
  // OSM 瓦片本身就是标准 WGS-84，不需要火星坐标转换，所以这个开关关掉。
  // 以后想切回高德，把下面这行改成 true 即可。
  var USE_GCJ = false;

  function wgs84ToGcj02(lng, lat) {
    if (!USE_GCJ) return [lng, lat];   // OSM 模式下坐标原样返回
    if (outOfChina(lng, lat)) return [lng, lat];
    var dLat = tLat(lng - 105, lat - 35);
    var dLng = tLng(lng - 105, lat - 35);
    var radLat = lat / 180 * PI;
    var magic = Math.sin(radLat);
    magic = 1 - EE * magic * magic;
    var sqrtMagic = Math.sqrt(magic);
    dLat = (dLat * 180) / ((AA * (1 - EE)) / (magic * sqrtMagic) * PI);
    dLng = (dLng * 180) / (AA / sqrtMagic * Math.cos(radLat) * PI);
    return [lng + dLng, lat + dLat];
  }

  // 地大西区（WGS-84 坐标）。要精确到 51 栋，把下面这两个数改成你在高德上点到的位置即可
  var CUG = wgs84ToGcj02(114.3940, 30.5230);

  // 1. 建地图，中心点定在这栋楼、缩放级别 17
  var map = L.map('map').setView([CUG[1], CUG[0]], 17);

  // 2. 铺底图：OpenStreetMap 官方瓦片（WGS-84，和我们的数据同一套坐标）
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    subdomains: 'abc',
    maxZoom: 19,
    attribution: '底图 © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> 贡献者'
  }).addTo(map);

  // 3. 在西区 51 栋放一个圆点
  var dot = L.divIcon({
    className: '',
    html: '<div style="width:14px;height:14px;background:#1B9AAA;border:3px solid #fff;border-radius:50%;box-shadow:0 0 8px rgba(0,0,0,.45)"></div>',
    iconSize: [20, 20],
    iconAnchor: [10, 10]
  });
  L.marker([CUG[1], CUG[0]], { icon: dot })
    .addTo(map)
    .bindPopup('中国地质大学 · 西区')
    .openPopup();

  // 4. 实时定位：点按钮 → 浏览器给出当前位置（WGS-84）→ 转火星坐标 → 标一个橙点
  var meDot = L.divIcon({
    className: '',
    html: '<div style="width:16px;height:16px;background:#D99A3E;border:3px solid #fff;border-radius:50%;box-shadow:0 0 10px rgba(0,0,0,.5)"></div>',
    iconSize: [22, 22],
    iconAnchor: [11, 11]
  });
  var meMarker = null;
  var locBtn = document.getElementById('locBtn');
  var locMsg = document.getElementById('locMsg');
  function showMsg(t) { locMsg.textContent = t; locMsg.style.display = 'block'; }

  map.on('locationfound', function (e) {
    var g = wgs84ToGcj02(e.latlng.lng, e.latlng.lat);   // GPS 本来就是 WGS-84，OSM 底图直接用；切回高德时才转
    var ll = L.latLng(g[1], g[0]);
    if (meMarker) map.removeLayer(meMarker);
    meMarker = L.marker(ll, { icon: meDot })
      .addTo(map)
      .bindPopup('你在这里 · 误差约 ' + Math.round(e.accuracy) + ' 米')
      .openPopup();
    map.setView(ll, 17);
    locBtn.disabled = false;
    locBtn.textContent = '重新定位';
    showMsg('定位成功，误差约 ' + Math.round(e.accuracy) + ' 米');
  });

  map.on('locationerror', function (e) {
    locBtn.disabled = false;
    locBtn.textContent = '定位我';
    var reason = { 1: '你拒绝了位置权限', 2: '设备拿不到定位信号', 3: '定位超时' }[e.code] || e.message;
    showMsg('定位失败：' + reason + '。可以换个浏览器（手机自带浏览器、Safari）再试，或到户外/窗边。');
  });

  locBtn.addEventListener('click', function () {
    locBtn.disabled = true;
    locBtn.textContent = '定位中…';
    locMsg.style.display = 'none';
    // setView:false —— 自己拿到坐标、转换完再移动地图，避免先跳到 WGS-84 的原点
    // enableHighAccuracy:false —— 室内高精度定位经常超时，用网络定位反而更容易出结果
    map.locate({ setView: false, enableHighAccuracy: false, timeout: 30000, maximumAge: 60000 });
  });

  // ===================================================================
  // 5. 从外部 GeoJSON 文件加载图层
  //    数据在 data/cug.geojson，里面有 5 个点（图书馆、操场……）
  //    和 1 条线（校园主轴）。改数据只改那个文件，这里不用动。
  // ===================================================================
  var CATEGORY_COLOR = {
    '学习': '#1B9AAA',   // 青
    '生活': '#D99A3E',   // 橙
    '运动': '#4CAF50',   // 绿
    '地标': '#8E6CC9',   // 紫
    '路线': '#1B9AAA'
  };

  // 按 properties.category 生成不同颜色的圆点图标
  function makeIcon(props) {
    var c = CATEGORY_COLOR[props.category] || '#888';
    return L.divIcon({
      className: '',
      html: '<div style="width:16px;height:16px;background:' + c +
            ';border:3px solid #fff;border-radius:50%;box-shadow:0 0 8px rgba(0,0,0,.45)"></div>',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });
  }

  fetch('./data/cug.geojson')
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (data) {
      var layer = L.geoJSON(data, {
        // GeoJSON 标准规定坐标是 WGS-84，我们的底图是高德（GCJ-02）。
        // coordsToLatLng 会对每一个坐标点调用一次，正好在这里统一转换，
        // 这样数据文件里就能老老实实存 WGS-84，符合规范。
        coordsToLatLng: function (coords) {
          var g = wgs84ToGcj02(coords[0], coords[1]);
          return L.latLng(g[1], g[0]);
        },

        // 点用彩色圆点图标
        pointToLayer: function (feature, latlng) {
          return L.marker(latlng, { icon: makeIcon(feature.properties) });
        },

        // 线（LineString）的样式：虚线
        style: function (feature) {
          return { color: CATEGORY_COLOR[feature.properties.category] || '#1B9AAA', weight: 3, dashArray: '7 6' };
        },

        // 每个要素点一下弹窗，内容取自 properties 里的字段
        onEachFeature: function (feature, layer) {
          var p = feature.properties;
          layer.bindPopup(
            '<b>' + p.name + '</b><br>' +
            '<span style="color:#888;font-size:12px">' + p.category + '</span><br>' +
            p.note
          );
        }
      }).addTo(map);

      // 自动缩放到能看见全部要素的范围
      map.closePopup();
      map.fitBounds(layer.getBounds(), { padding: [40, 40] });
    })
    .catch(function (err) {
      console.error('GeoJSON 加载失败：', err);
      // 用 file:// 双击打开时，浏览器出于安全不允许页面读取本地文件，会走到这里
      var tip = document.createElement('div');
      tip.className = 'tip';
      tip.style.top = 'auto';
      tip.style.bottom = '12px';
      tip.innerHTML = '<b>GeoJSON 没加载出来</b><br>' +
        '浏览器不允许 file:// 页面读取本地文件。<br>' +
        '双击项目里的「启动服务器.bat」，再访问 http://localhost:8000';
      document.body.appendChild(tip);
    });

  // ===================================================================
  // 6. OSM 建筑轮廓（Polygon）
  //    数据是 Overpass Turbo 导出的 export.geojson，复制成了 data/buildings.geojson
  //    GeoJSON 里存的是 WGS-84，底图是 GCJ-02，所以还是过一遍坐标转换
  // ===================================================================
  map.createPane('buildings');
  map.getPane('buildings').style.zIndex = 350;   // 压在路线和圆点下面，不挡事

  var buildingsLayer = null;
  var BLD_FILL = 0.18;   // 平时很淡，只当描边用

  fetch('./data/buildings.geojson')
    .then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (data) {
      var buildings = L.geoJSON(data, {
        pane: 'buildings',
        coordsToLatLng: function (coords) {
          var g = wgs84ToGcj02(coords[0], coords[1]);
          return L.latLng(g[1], g[0]);
        },
        style: function () {
          return {
            color: '#7d8fa3', weight: 1, opacity: 0.7,
            fillColor: '#9aaec2', fillOpacity: BLD_FILL
          };
        },
        onEachFeature: function (feature, layer) {
          var name = feature.properties.name;
          if (!name) return;
          layer.bindTooltip(name, { sticky: true });
          layer.on('mouseover', function () { layer.setStyle({ fillOpacity: 0.45 }); });
          layer.on('mouseout', function () { layer.setStyle({ fillOpacity: BLD_FILL }); });
        }
      }).addTo(map);
      buildingsLayer = buildings;
      console.log('建筑轮廓加载完成：' + buildings.getLayers().length + ' 栋');
    })
    .catch(function (err) {
      console.warn('建筑数据没加载出来：', err);
    });

  // 建筑层开关：底图和 OSM 数据对不上时，可以把它关掉单独看图
  var bldBtn = document.getElementById('bldBtn');
  bldBtn.addEventListener('click', function () {
    if (!buildingsLayer) {
      bldBtn.textContent = '建筑还没加载好';
      return;
    }
    if (map.hasLayer(buildingsLayer)) {
      map.removeLayer(buildingsLayer);
      bldBtn.textContent = '显示建筑';
    } else {
      map.addLayer(buildingsLayer);
      bldBtn.textContent = '隐藏建筑';
    }
  });
</script>
</body>
</html>
